# Build-from-source override.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Builds the image locally (tagged with the same name as the published image)
# instead of pulling it from GHCR.
services:
  excalidraw-mcp:
    build:
      context: .
      args:
        # Pin to an upstream branch, tag, or commit for reproducible builds.
        EXCALIDRAW_MCP_REF: ${EXCALIDRAW_MCP_REF:-main}
